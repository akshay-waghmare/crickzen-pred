[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bbl_pipeline"
version = "0.1.0"
description = "BBL Data Ingestion and Processing Pipeline"
authors = [
  { name = "Akshay Waghmare", email = "akshay@example.com" },
]
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "pandera>=0.18.0",
    "rapidfuzz>=3.0.0",
    "click>=8.0.0",
    "structlog>=23.0.0",
    "pyyaml>=6.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "python-telegram-bot>=20.0",
    "python-decouple>=3.8",
]
requires-python = ">=3.10"

[project.scripts]
bbl-pipeline = "bbl_pipeline.cli:main"
bbl-telegram-signals = "bbl_pipeline.telegram.signal_runner:main"
bbl-prod-ops = "bbl_pipeline.ops.prod_ops_agent:main"

[tool.setuptools.packages.find]
where = ["src"]
