{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]"
     x-data="{
        email: '',
        password: '',
        error: '',
        loading: false,
        async login() {
            this.error = '';
            this.loading = true;
            try {
                const resp = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: this.email, password: this.password }),
                    credentials: 'include',
                });
                if (resp.ok) {
                    const data = await resp.json();
                    sessionStorage.setItem('access_token', data.access_token);
                    sessionStorage.setItem('token_expires_in', data.expires_in);
                    sessionStorage.setItem('token_issued_at', Date.now().toString());
                    window.location.href = '/';
                } else {
                    const err = await resp.json();
                    if (resp.status === 429) {
                        this.error = 'Too many login attempts. Please wait a minute.';
                    } else if (resp.status === 403) {
                        this.error = 'Your account has been deactivated.';
                    } else {
                        this.error = err.detail || 'Invalid email or password.';
                    }
                }
            } catch (e) {
                this.error = 'Network error. Please try again.';
            } finally {
                this.loading = false;
            }
        }
    }">

    <div class="w-full max-w-md">
        <!-- Card -->
        <div class="bg-surface-800 rounded-2xl border border-surface-700 p-8 shadow-2xl">
            <!-- Logo -->
            <div class="text-center mb-8">
                <span class="text-5xl mb-3 block">🏏</span>
                <h2 class="text-2xl font-bold text-white">Welcome to CrickenZen</h2>
                <p class="text-gray-400 mt-2 text-sm">Sign in to access live predictions</p>
            </div>

            <!-- Error message -->
            <div x-show="error" x-cloak
                 class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm"
                 x-text="error">
            </div>

            <!-- Form -->
            <form @submit.prevent="login()" class="space-y-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-1.5">Email</label>
                    <input
                        id="email"
                        type="email"
                        x-model="email"
                        required
                        placeholder="you@example.com"
                        class="w-full bg-surface-700 border border-surface-600 rounded-lg px-4 py-2.5 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                    <input
                        id="password"
                        type="password"
                        x-model="password"
                        required
                        minlength="8"
                        placeholder="••••••••"
                        class="w-full bg-surface-700 border border-surface-600 rounded-lg px-4 py-2.5 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200"
                    >
                </div>

                <button
                    type="submit"
                    :disabled="loading"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-6 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 focus:ring-offset-surface-900 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                >
                    <span x-show="loading" class="animate-spin text-lg">⟳</span>
                    <span x-text="loading ? 'Signing in...' : 'Sign In'"></span>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative mt-6 mb-5">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-surface-600"></div>
                </div>
                <div class="relative flex justify-center text-xs">
                    <span class="bg-surface-800 px-3 text-gray-500">New to CrickenZen?</span>
                </div>
            </div>

            <!-- Register link -->
            <a
                href="/register"
                class="w-full flex items-center justify-center gap-2 border border-surface-600 hover:border-emerald-500/50 text-gray-300 hover:text-emerald-400 font-medium py-2.5 px-6 rounded-lg transition-all duration-200 text-sm"
            >
                Create an account →
            </a>
        </div>

        <p class="text-center text-xs text-gray-600 mt-6">
            Powered by CrickenZen ML Pipeline
        </p>
    </div>
</div>
{% endblock %}
