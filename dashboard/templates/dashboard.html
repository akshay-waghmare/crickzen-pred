{% extends "base.html" %}

{% block title %}Live Dashboard{% endblock %}

{% block nav_items %}
    <!-- Live status badge -->
    <div x-data x-show="$store.dashboard && $store.dashboard.isLive" x-cloak>
        <span class="badge-live">
            <span class="w-2 h-2 bg-red-500 rounded-full mr-1.5 animate-pulse"></span>
            LIVE
        </span>
    </div>
    <div x-data x-show="$store.dashboard && $store.dashboard.isStale" x-cloak>
        <span class="badge-stale">⚠ Delayed</span>
    </div>

    <!-- League selector -->
    <div x-data>
        <select x-model="$store.dashboard.selectedLeague"
                @change="$store.dashboard.fetchState()"
                class="select-field">
            <option value="">Auto</option>
            <option value="bbl">BBL</option>
            <option value="sa20">SA20</option>
            <option value="ilt20">ILT20</option>
            <option value="wpl">WPL</option>
            <option value="ssm">SSM</option>
            <option value="ipl">IPL</option>
            <option value="psl">PSL</option>
            <option value="cpl">CPL</option>
        </select>
    </div>

    <!-- Logout -->
    <div x-data>
        <button @click="$store.dashboard.logout()" class="btn-ghost">Logout</button>
    </div>
{% endblock %}

{% block content %}
<div x-data x-init="$store.dashboard.init()">

    <!-- Auth check: redirect to /login if no access token -->
    <template x-if="!$store.dashboard.accessToken">
        <div x-init="window.location.href = '/login'"></div>
    </template>

    <!-- Loading state -->
    <template x-if="$store.dashboard.accessToken && !$store.dashboard.state && !$store.dashboard.error">
        <div class="flex flex-col items-center justify-center min-h-[60vh] gap-4 fade-in">
            <div class="animate-spin text-5xl">🏏</div>
            <p class="text-gray-400 text-lg">Waiting for live data…</p>
            <p class="text-gray-600 text-sm">The prediction engine will start broadcasting when a match is live.</p>
        </div>
    </template>

    <!-- Error state -->
    <template x-if="$store.dashboard.error">
        <div class="flex flex-col items-center justify-center min-h-[60vh] gap-4 fade-in">
            <span class="text-5xl">⚠️</span>
            <p class="text-yellow-400 text-lg" x-text="$store.dashboard.error"></p>
            <button @click="$store.dashboard.fetchState()" class="btn-primary">Retry</button>
        </div>
    </template>

    <!-- Main dashboard content -->
    <template x-if="$store.dashboard.state">
        <div class="space-y-6 slide-up">

            <!-- Match Over Banner -->
            <div x-show="$store.dashboard.state.match_over" x-cloak
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 class="bg-emerald-600/20 border border-emerald-500/30 rounded-xl p-6 text-center">
                <h2 class="text-2xl font-bold text-emerald-400">🏆 Match Over</h2>
                <p class="text-lg text-gray-200 mt-2" x-text="$store.dashboard.state.result || 'Match completed'"></p>
            </div>

            <!-- Calibration chain badge -->
            <div x-show="$store.dashboard.state.calibration_chain" x-cloak class="text-center">
                <span class="badge-calibration">
                    📊 <span class="ml-1" x-text="$store.dashboard.state.calibration_chain"></span>
                </span>
            </div>

            <!-- Score Panel — responsive grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Batting Team Score -->
                <div class="card text-center">
                    <p class="score-label mb-2" x-text="$store.dashboard.state.batting_team"></p>
                    <p class="score-value">
                        <span x-text="$store.dashboard.state.score"></span>/<span x-text="$store.dashboard.state.wickets"></span>
                    </p>
                    <p class="text-lg text-gray-400 mt-1">
                        (<span x-text="$store.dashboard.state.overs"></span> ov)
                    </p>
                    <!-- Phase indicator -->
                    <div class="mt-3">
                        <span class="badge bg-surface-700 text-gray-300 border border-surface-600 capitalize"
                              x-text="$store.dashboard.state.phase"></span>
                    </div>
                </div>

                <!-- Win Probability Gauges -->
                <div class="card flex flex-col items-center justify-center sm:col-span-2 lg:col-span-1">
                    <p class="score-label mb-3">Win Probability</p>
                    <div class="flex items-center gap-6 w-full justify-center">
                        <div class="text-center">
                            <div class="chart-container" style="width: 140px; height: 90px;">
                                <canvas id="gauge-home"></canvas>
                            </div>
                            <p class="text-xs text-gray-400 mt-1" x-text="$store.dashboard.state.batting_team"></p>
                        </div>
                        <div class="text-center">
                            <div class="chart-container" style="width: 140px; height: 90px;">
                                <canvas id="gauge-away"></canvas>
                            </div>
                            <p class="text-xs text-gray-400 mt-1" x-text="$store.dashboard.state.bowling_team"></p>
                        </div>
                    </div>
                </div>

                <!-- Target / Run Rates -->
                <div class="card text-center">
                    <template x-if="$store.dashboard.state.is_second_innings">
                        <div>
                            <p class="score-label mb-1">Target</p>
                            <p class="text-3xl font-bold text-white" x-text="$store.dashboard.state.target"></p>
                            <p class="text-sm text-gray-400 mt-2">
                                Need <span class="text-emerald-400 font-semibold" x-text="Math.max(0, $store.dashboard.state.target - $store.dashboard.state.score)"></span>
                                from <span x-text="Math.max(0, 120 - Math.floor($store.dashboard.state.overs) * 6 - Math.round(($store.dashboard.state.overs % 1) * 10))"></span> balls
                            </p>
                        </div>
                    </template>
                    <template x-if="!$store.dashboard.state.is_second_innings">
                        <div>
                            <p class="score-label mb-1">1st Innings</p>
                            <p class="text-gray-300 mt-4 capitalize">
                                <span x-text="$store.dashboard.state.phase"></span> phase
                            </p>
                        </div>
                    </template>
                    <!-- CRR / RRR -->
                    <div class="mt-4 flex items-center justify-center gap-6 text-sm">
                        <div>
                            <span class="text-gray-500 text-xs uppercase">CRR</span>
                            <span class="block text-emerald-400 font-bold text-lg tabular-nums" x-text="($store.dashboard.state.current_run_rate || 0).toFixed(2)"></span>
                        </div>
                        <div x-show="$store.dashboard.state.required_run_rate" x-cloak>
                            <span class="text-gray-500 text-xs uppercase">RRR</span>
                            <span class="block font-bold text-lg tabular-nums"
                                  :class="$store.dashboard.state.required_run_rate > $store.dashboard.state.current_run_rate ? 'text-red-400' : 'text-emerald-400'"
                                  x-text="($store.dashboard.state.required_run_rate || 0).toFixed(2)"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Probability Timeline Chart -->
            <div class="card">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-200">Win Probability Timeline</h3>
                    <p class="text-xs text-gray-500">
                        Innings <span x-text="$store.dashboard.state.is_second_innings ? '2' : '1'"></span>
                        — <span x-text="$store.dashboard.state.phase" class="capitalize"></span>
                    </p>
                </div>
                <div class="chart-container" style="height: 280px; max-height: 35vh;">
                    <canvas id="prob-chart"></canvas>
                </div>
            </div>

            <!-- Run Rate Chart (2nd innings only) -->
            <div class="card" x-show="$store.dashboard.state.is_second_innings" x-cloak
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0"
                 x-transition:enter-end="opacity-100">
                <h3 class="text-lg font-semibold text-gray-200 mb-4">Run Rate Comparison</h3>
                <div class="chart-container" style="height: 180px;">
                    <canvas id="rr-chart"></canvas>
                </div>
            </div>

            <!-- Innings Break Banner -->
            <div x-show="$store.dashboard.state.innings_break" x-cloak
                 x-transition:enter="transition ease-out duration-300"
                 class="bg-surface-700/50 border border-surface-600 rounded-xl p-6 text-center">
                <p class="text-lg font-semibold text-yellow-400">🔄 Innings Break</p>
                <p class="text-sm text-gray-400 mt-1">Waiting for 2nd innings to begin…</p>
            </div>

        </div>
    </template>

</div>
{% endblock %}

{% block scripts %}
<script>
    // Server-injected config
    const POLL_INTERVAL_MS = {{ poll_interval_ms }};
</script>
<script src="/static/js/dashboard.js"></script>
{% endblock %}
