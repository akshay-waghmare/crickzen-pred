{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh]"
     x-data="{
        email: '',
        password: '',
        confirmPassword: '',
        error: '',
        success: '',
        loading: false,
        async register() {
            this.error = '';
            this.success = '';

            if (this.password !== this.confirmPassword) {
                this.error = 'Passwords do not match.';
                return;
            }
            if (this.password.length < 8) {
                this.error = 'Password must be at least 8 characters.';
                return;
            }

            this.loading = true;
            try {
                const resp = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: this.email,
                        password: this.password,
                        confirm_password: this.confirmPassword
                    }),
                    credentials: 'include',
                });

                if (resp.status === 201) {
                    this.success = 'Account created! Redirecting to login…';
                    setTimeout(() => { window.location.href = '/login'; }, 1800);
                } else if (resp.status === 409) {
                    this.error = 'An account with this email already exists.';
                } else if (resp.status === 403) {
                    this.error = 'Registration is currently closed. Contact the administrator.';
                } else if (resp.status === 429) {
                    this.error = 'Too many attempts. Please wait a minute and try again.';
                } else {
                    const data = await resp.json().catch(() => ({}));
                    this.error = data.detail || 'Registration failed. Please try again.';
                }
            } catch (e) {
                this.error = 'Network error. Please try again.';
            } finally {
                this.loading = false;
            }
        }
    }">

    <div class="w-full max-w-md">
        <!-- Card -->
        <div class="bg-surface-800 rounded-2xl border border-surface-700 p-8 shadow-2xl">

            <!-- Logo -->
            <div class="text-center mb-8">
                <span class="text-5xl mb-3 block">🏏</span>
                <h2 class="text-2xl font-bold text-white">Create your account</h2>
                <p class="text-gray-400 mt-2 text-sm">Get access to live T20 win predictions</p>
            </div>

            <!-- Success message -->
            <div x-show="success" x-cloak
                 class="mb-4 p-3 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-sm flex items-center gap-2">
                <span>✅</span>
                <span x-text="success"></span>
            </div>

            <!-- Error message -->
            <div x-show="error" x-cloak
                 class="mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm flex items-center gap-2">
                <span>⚠️</span>
                <span x-text="error"></span>
            </div>

            <!-- Form -->
            <form @submit.prevent="register()" class="space-y-5">

                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-1.5">
                        Email address
                    </label>
                    <input
                        id="email"
                        type="email"
                        x-model="email"
                        required
                        placeholder="you@example.com"
                        autocomplete="email"
                        class="w-full bg-surface-700 border border-surface-600 rounded-lg px-4 py-2.5 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200"
                    >
                </div>

                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-1.5">
                        Password
                        <span class="text-gray-500 font-normal">(min. 8 characters)</span>
                    </label>
                    <input
                        id="password"
                        type="password"
                        x-model="password"
                        required
                        minlength="8"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        class="w-full bg-surface-700 border border-surface-600 rounded-lg px-4 py-2.5 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200"
                    >
                    <!-- Strength indicator -->
                    <div class="mt-2 h-1 w-full bg-surface-600 rounded-full overflow-hidden">
                        <div
                            class="h-full rounded-full transition-all duration-300"
                            :class="{
                                'w-0': password.length === 0,
                                'w-1/4 bg-red-500': password.length > 0 && password.length < 6,
                                'w-1/2 bg-yellow-500': password.length >= 6 && password.length < 10,
                                'w-3/4 bg-blue-500': password.length >= 10 && password.length < 14,
                                'w-full bg-emerald-500': password.length >= 14
                            }"
                        ></div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-300 mb-1.5">
                        Confirm password
                    </label>
                    <input
                        id="confirmPassword"
                        type="password"
                        x-model="confirmPassword"
                        required
                        minlength="8"
                        placeholder="••••••••"
                        autocomplete="new-password"
                        class="w-full bg-surface-700 border border-surface-600 rounded-lg px-4 py-2.5 text-gray-100 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all duration-200"
                        :class="confirmPassword && password !== confirmPassword
                            ? 'border-red-500/60 focus:ring-red-500'
                            : confirmPassword && password === confirmPassword
                            ? 'border-emerald-500/60 focus:ring-emerald-500'
                            : ''"
                    >
                    <p
                        x-show="confirmPassword && password !== confirmPassword"
                        x-cloak
                        class="mt-1.5 text-xs text-red-400"
                    >Passwords don't match</p>
                    <p
                        x-show="confirmPassword && password === confirmPassword && confirmPassword.length >= 8"
                        x-cloak
                        class="mt-1.5 text-xs text-emerald-400"
                    >✓ Passwords match</p>
                </div>

                <!-- Submit -->
                <button
                    type="submit"
                    :disabled="loading || (confirmPassword && password !== confirmPassword)"
                    class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-6 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:ring-offset-2 focus:ring-offset-surface-900 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                >
                    <span x-show="loading" class="animate-spin text-lg">⟳</span>
                    <span x-text="loading ? 'Creating account…' : 'Create Account'"></span>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative mt-6 mb-5">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-surface-600"></div>
                </div>
                <div class="relative flex justify-center text-xs">
                    <span class="bg-surface-800 px-3 text-gray-500">Already have an account?</span>
                </div>
            </div>

            <!-- Back to Login -->
            <a
                href="/login"
                class="w-full flex items-center justify-center gap-2 border border-surface-600 hover:border-emerald-500/50 text-gray-300 hover:text-emerald-400 font-medium py-2.5 px-6 rounded-lg transition-all duration-200 text-sm"
            >
                ← Back to Sign In
            </a>
        </div>

        <p class="text-center text-xs text-gray-600 mt-6">
            Powered by CrickenZen ML Pipeline
        </p>
    </div>
</div>
{% endblock %}
