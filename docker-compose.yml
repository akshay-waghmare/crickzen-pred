version: "3.8"

services:
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: crickenzen-dashboard
    env_file: dashboard/.env
    ports:
      - "8000:8000"
    volumes:
      # Mount model + data directories read-only
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: crickenzen-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      dashboard:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
