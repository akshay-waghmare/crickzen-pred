FormatConfig(
    format_name='t20', gender='male',
    total_overs=20, total_balls=120,
    par_score=160.0, league_avg_score=165.0,
    bat_first_win_rate=0.37,
    phase_thresholds={'powerplay': 6, 'middle': 14, 'death': 18, 'final': 20},
    phase_names=['powerplay', 'middle', 'death', 'final'],
    expected_run_rates={'powerplay': 7.5, 'middle': 7.8, 'death': 9.5, 'final': 11.0},
    rrr_midpoint=9.5, rrr_beta=0.7,
    sqi_beta=0.75, sqi_shift=0.35,
    confidence_full_overs=12.0,
    score_std_early=15.0, score_std_late=26.0,
    score_cap_min=100.0, score_cap_max=280.0,
    endgame_balls=12,
    pressure_rrr_min=7.0, pressure_rrr_max=15.0,
    # ... DLS table, penalty tables from current hardcodes
)
```

