services:
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: crickzen-dashboard
    env_file:
      - dashboard/.env
    environment:
      PYTHONPATH: /app/src:/app
      PROJECT_ROOT: /app
      DATABASE_URL: sqlite:////app/data/dashboard_auth.db
      STATE_DIR: /app/data/dashboard_states
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - victoryline-network

  evidence-watcher:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: crickzen-evidence-watcher
    env_file:
      - dashboard/.env
    environment:
      PYTHONPATH: /app/src:/app
      PROJECT_ROOT: /app
      MATCH_STATES_DIR: /app/data/match_states
      STATE_DIR: /app/data/dashboard_states
      RECORD_MATCH_STATES: "true"
    working_dir: /app
    command:
      - python
      - -m
      - bbl_pipeline.ops.evidence_storage_watcher
      - watch
      - --interval-seconds
      - "60"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, pathlib, sys;
          p=pathlib.Path('/app/data/model_reviews/evidence_watcher.json');
          d=json.loads(p.read_text()) if p.exists() else {};
          sys.exit(0 if d.get('status') in ('healthy','warning') else 1)
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  victoryline-network:
    external: true
    name: victoryline-monorepo_victoryline-network
