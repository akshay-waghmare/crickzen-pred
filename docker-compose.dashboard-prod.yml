services:
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: crickzen-dashboard
    env_file:
      - dashboard/.env
    environment:
      PYTHONPATH: /app/src:/app
      PROJECT_ROOT: /app
      DATABASE_URL: sqlite:////app/data/dashboard_auth.db
      STATE_DIR: /app/data/dashboard_states
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8000}:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      - victoryline-network

networks:
  victoryline-network:
    external: true
    name: victoryline-monorepo_victoryline-network
